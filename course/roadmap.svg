<svg xmlns="http://www.w3.org/2000/svg" width="820" height="564" viewBox="0 0 820 564" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="title">The year at a glance, 2026/27: the stages of SAA and PIA, the holidays and the exams</title>
<desc id="desc">Time runs from left to right, from October 2026 to June 2027, and the stages are listed in the recommended order; the dates are estimates, the exams are fixed. 1 Getting started (PIA), 14–25 Oct. 2 What AI and machine learning are (SAA), 19–25 Oct. 3 Python for AI (PIA), 19 Oct – 1 Nov. 4 Working with data (PIA), 26 Oct – 6 Dec. 5 Supervised learning (SAA), 9 Nov – 31 Jan. 6 Building with language models (PIA), 7 Dec – 17 Jan. 7 Serving models (PIA), 18–31 Jan. 8 Neural networks (SAA), 1–28 Feb. 9 Agents and MCP (PIA), 1 Feb – 21 Mar. Exams: SAA Tue 2 Feb, PIA Thu 4 Feb. 10 How language models work (SAA), 15 Mar – 4 Apr. 11 Retrieval-augmented generation (RAG) (PIA), 30 Mar – 18 Apr. 12 Automation and business (PIA), 19 Apr – 2 May. 13 Unsupervised learning (SAA), 26 Apr – 16 May. 14 Vision and voice with pretrained models (PIA), 10–23 May. 15 Reinforcement learning (SAA), 10–23 May. Exams: SAA Mon 24 May, PIA Wed 26 May. Exams: SAA Thu 10 Jun, PIA Mon 14 Jun. Holidays: Christmas, 22 Dec – 7 Jan; Easter, 22–29 Mar.</desc>
